name: 📚 English Lesson Feedback
on:
  schedule:
    # UTC 00:10 = KST 09:10 (월~금)
    # ※ GitHub Actions 무료 cron은 2~3시간 지연 → 실제 실행 KST 11:30~12:00 경
    - cron: '10 0 * * 1-5'

  workflow_dispatch:
    inputs:
      debug:
        description: '디버그 모드'
        required: false
        default: 'false'
      target_date:
        description: '특정 날짜 녹음 재처리 (YYYY-MM-DD, backfill용 / 비우면 오늘)'
        required: false
        default: ''
permissions:
  contents: write
# 🛡️ 중복 실행 방지: 버튼을 여러 번 눌러도 마지막 1개만 실행
concurrency:
  group: english-feedback
  cancel-in-progress: true
jobs:
  process-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 의존성 설치
        run: pip install -r requirements.txt
      - name: 🚀 피드백 생성 및 발송
        run: python process_lesson.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_DONE_FOLDER_ID: ${{ secrets.DRIVE_DONE_FOLDER_ID }}
          GITHUB_PAGES_URL: ${{ secrets.GITHUB_PAGES_URL }}
          # backfill: 특정 날짜 녹음 재처리 (비어 있으면 오늘 자동 처리)
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          # telegram-notify-hub: 피드백 완료 시 텔레그램 알림방으로 알림 (옵션)
          KNH_SEND_SECRET: ${{ secrets.KNH_SEND_SECRET }}
          KNH_CHANNEL: telegram

      # 처리 실패 시 텔레그램으로 알림 (조용히 죽는 것 방지)
      - name: 🔔 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://telegram-notify-hub.dk0327.workers.dev/send" \
            -H "X-Notify-Secret: $KNH_SEND_SECRET" -H "Content-Type: application/json" \
            -d '{"channel":"telegram","text":"❌ 전화영어 피드백 자동화 실패 — GitHub Actions 로그 확인 필요"}' || true
        env:
          KNH_SEND_SECRET: ${{ secrets.KNH_SEND_SECRET }}
