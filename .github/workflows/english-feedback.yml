name: 📚 English Lesson Feedback
on:
  schedule:
    # UTC 00:10 = KST 09:10 (월~금)
    # ※ GitHub Actions 무료 cron은 2~3시간 지연 → 실제 실행 KST 11:30~12:00 경
    - cron: '10 0 * * 1-5'

  workflow_dispatch:
    inputs:
      debug:
        description: '디버그 모드'
        required: false
        default: 'false'
      target_date:
        description: '특정 날짜 녹음 재처리 (YYYY-MM-DD, backfill용 / 비우면 오늘)'
        required: false
        default: ''
permissions:
  contents: write
# 🛡️ 중복 실행 방지: 버튼을 여러 번 눌러도 마지막 1개만 실행
concurrency:
  group: english-feedback
  cancel-in-progress: true
jobs:
  process-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 본 처리 12분 + 원본 채우기 6분 + 알림 여유
    env:
      # 출력을 모아 두지 않고 바로 찍는다 — 시간 초과로 강제 종료돼도 어디서 멈췄는지 로그에 남는다
      # (2026-09-23 실행은 15분 동안 한 줄도 안 남기고 취소됐다)
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 의존성 설치
        run: pip install -r requirements.txt
      - name: 🚀 피드백 생성 및 발송
        # 단계 자체에 시간 제한 → 넘기면 '실패'로 끝나 아래 알림이 확실히 돈다(작업 전체 취소면 알림도 못 돌 수 있다)
        timeout-minutes: 12
        run: python process_lesson.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_DONE_FOLDER_ID: ${{ secrets.DRIVE_DONE_FOLDER_ID }}
          # ⚠️ GitHub은 'GITHUB_'로 시작하는 시크릿 생성을 금지 → 시크릿명은 PAGES_URL,
          #    러너 환경변수로는 GITHUB_PAGES_URL 로 매핑(코드가 읽는 이름).
          GITHUB_PAGES_URL: ${{ secrets.PAGES_URL }}
          # backfill: 특정 날짜 녹음 재처리 (비어 있으면 오늘 자동 처리)
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          # telegram-notify-hub: 피드백 완료 시 텔레그램 알림방으로 알림 (옵션)
          KNH_SEND_SECRET: ${{ secrets.KNH_SEND_SECRET }}
          KNH_CHANNEL: telegram

      # 빠진 Whisper 원본 채우기 (best-effort): 원본 보관이 실패한 날을 다음 실행이 메운다.
      # 위 단계의 페이지·메일·알림은 이미 끝났고, 이 단계가 실패해도 작업은 성공으로 남는다.
      - name: 🗄️ 빠진 원본 채우기
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/backfill_raw.py --max 2
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRIVE_DONE_FOLDER_ID: ${{ secrets.DRIVE_DONE_FOLDER_ID }}

      # 처리 실패·시간 초과(취소) 시 텔레그램으로 알림 (조용히 죽는 것 방지)
      # failure() 만으로는 15분 시간 초과로 '취소'된 실행에 알림이 가지 않았다 (08-05·08-17·08-21·09-23 수업 누락)
      - name: 🔔 실패 시 텔레그램 알림
        if: failure() || cancelled()
        run: |
          curl -s -X POST "https://telegram-notify-hub.dk0327.workers.dev/send" \
            -H "X-Notify-Secret: $KNH_SEND_SECRET" -H "Content-Type: application/json" \
            -d '{"channel":"telegram","text":"❌ 전화영어 피드백 자동화 실패 또는 시간 초과 — GitHub Actions 로그 확인 필요"}' || true
        env:
          KNH_SEND_SECRET: ${{ secrets.KNH_SEND_SECRET }}
